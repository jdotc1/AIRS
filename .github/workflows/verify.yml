name: Source verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older run. A run on main is never
# cancelled: each main commit keeps its own completed result.
concurrency:
  group: "source-verification-${{ github.event_name == 'pull_request' && github.ref || github.sha }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python ${{ matrix.python }} source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.17', '3.15.0']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install schema test dependency
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Run owned unit tests with a receipt
        run: |
          python -I -B scripts/verify-python.py --receipt build/verification/python.json
          python -I -B - <<'PYCODE'
          import json
          from pathlib import Path
          receipt = json.loads(Path('build/verification/python.json').read_text())
          allowed = {
              ('test_private_python_reuse.RuntimeMetadataReuseTests.test_saved_observed_metadata_pair_without_runtime_access',
               'Saved diagnostic fixture not selected'),
              ('test_swift_declaration_grammar_oracle.DeclarationGrammarOracleTests.test_differential',
               'swift-demangle unavailable'),
          }
          unexpected = [(item['test'], item['reason']) for item in receipt['skipped']
                        if (item['test'], item['reason']) not in allowed]
          if unexpected:
              raise SystemExit(f'Unexpected skipped tests: {unexpected}')
          PYCODE
      - name: Retain Python receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.python }}-verification
          path: build/verification/python.json
          if-no-files-found: error
          retention-days: 14

  native:
    name: Swift source tests on macOS 27 arm64
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the source-test Python interpreter
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
          architecture: arm64
      - name: Record the actual host and toolchain
        run: |
          mkdir -p build/verification
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version > build/verification/xcode.txt
          xcrun swift --version > build/verification/swift.txt
          xcrun --show-sdk-version > build/verification/macos-sdk.txt
          sw_vers > build/verification/macos.txt
          git rev-parse HEAD > build/verification/source-revision.txt
      - name: Build both release executables
        id: native_build
        run: |
          set -o pipefail
          xcrun swift build --package-path native --configuration release --product AIRSApp -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=300 -Xswiftc -Xfrontend -Xswiftc -warn-long-function-bodies=300 2>&1 | tee build/verification/native-app-build.log
          xcrun swift build --package-path native --configuration release --product airs-entitlements -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=300 -Xswiftc -Xfrontend -Xswiftc -warn-long-function-bodies=300 2>&1 | tee build/verification/native-cli-build.log
      - name: Run sequential native tests
        id: native_tests
        env:
          AIRS_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -o pipefail
          xcrun swift test --package-path native 2>&1 | tee build/verification/native-tests.log
      - name: Record native qualification scope and visible skips
        if: always()
        env:
          NATIVE_BUILD_OUTCOME: ${{ steps.native_build.outcome }}
          NATIVE_TEST_OUTCOME: ${{ steps.native_tests.outcome }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path('build/verification')
          directory.mkdir(parents=True, exist_ok=True)
          log = directory / 'native-tests.log'
          lines = log.read_text(encoding='utf-8', errors='replace').splitlines() if log.exists() else []
          skipped = [line for line in lines if 'skipp' in line.lower()]
          receipt = {
              'schema_version': 1,
              'scope': 'native-source-tests',
              'build_step_outcome': os.environ['NATIVE_BUILD_OUTCOME'],
              'test_step_outcome': os.environ['NATIVE_TEST_OUTCOME'],
              'private_runtime_qualification': 'not_requested',
              'packaged_app_qualification': 'not_requested',
              'expected_runtime_skip': 'PrivatePythonTests.testActualPrivateChildUsesIsolatedNoSiteNoBytecodeAndCancellationSettles',
              'conditional_filesystem_skip': 'BundleDiscoveryTests.testInvalidNamesConsumeEntryBudgetAndRemainVisible',
              'skip_log_lines': skipped,
              'skip_accounting': 'Raw sequential XCTest lines; inspect the attached log. No test counts are inferred.',
          }
          (directory / 'native-scope.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('## Native source verification\n\n')
              summary.write('The private app runtime was not downloaded or prepared. Its actual-child test is expected to skip.\n\n')
              summary.write('A filesystem byte-name test may skip on a host that rejects that filename. Review all skip lines in native-tests.log before accepting this run.\n\n')
              summary.write('These results do not qualify app packaging, signing, notarization, or a clean Mac.\n')
          PY
      - name: Retain native logs and scope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-27-arm64-source-verification
          path: build/verification/
          if-no-files-found: error
          retention-days: 14

  oracle:
    name: ARM64 decode oracle on generated vectors
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check system Python
        id: system_python
        run: |
          if python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ORACLE_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select fallback Python
        id: fallback_python
        if: steps.system_python.outputs.available != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
          architecture: arm64
      - name: Record fallback interpreter
        if: steps.system_python.outputs.available != 'true'
        env:
          PYTHON_PATH: ${{ steps.fallback_python.outputs.python-path }}
        run: echo "ORACLE_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"
      - name: Generate instruction words
        run: |
          mkdir -p build/oracle
          "$ORACLE_PYTHON" -I -B scripts/arm64-oracle-words.py --out build/oracle/words.s
      - name: Assemble and disassemble generated words
        run: '"$ORACLE_PYTHON" -I -B scripts/arm64-oracle-generate.py --input build/oracle/words.s --out build/oracle'
      - name: Require agreement for every derived kind
        run: '"$ORACLE_PYTHON" -I -B scripts/arm64-oracle-diff.py --generated build/oracle/generated.tsv --require-kind-coverage --out build/oracle/results'
      - name: Retain oracle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-generated-oracle
          path: |
            build/oracle/results/summary.json
            build/oracle/results/disagreements*.tsv
            build/oracle/generated.tsv
            build/oracle/tools.txt
          if-no-files-found: error
          retention-days: 14

  declaration_grammar_oracle:
    name: Swift declaration grammar differential (SDK)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
          architecture: arm64
      - name: Record Swift toolchain
        run: |
          mkdir -p build/declaration-grammar
          xcrun swift --version | tee build/declaration-grammar/swift.txt
      - name: Run declaration grammar differential
        env:
          PYTHONPATH: src
          AIRS_GRAMMAR_COVERAGE_OUT: build/declaration-grammar/coverage.json
        run: python -B -m unittest discover -s tests -p test_swift_declaration_grammar_oracle.py -v
      - name: Retain grammar coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-declaration-grammar-coverage
          path: build/declaration-grammar/coverage.json
          if-no-files-found: error
          retention-days: 14
